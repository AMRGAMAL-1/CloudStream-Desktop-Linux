name: Build and Release

# Windows releases are not supported by this Linux-only fork.
# Linux releases are produced by `.github/workflows/linux.yml` on
# `linux-v*` tags with the user-facing title `CloudStream <version>`.
# This workflow is intentionally disabled and kept only so that a legacy
# `v*` tag push fails with a clear message instead of building a
# Windows installer.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disabled:
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse legacy Windows release flow
        run: |
          echo "Windows releases are not supported by CloudStream Desktop for Linux."
          echo "Push a 'linux-v<version>' tag instead; .github/workflows/linux.yml builds and publishes the Linux packages."
          exit 1
