name: Linux CI and Packages

on:
  push:
    branches: ["work"]
    tags: ["linux-v*"]
  pull_request:
    branches: ["work"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Release baseline: Ubuntu 22.04 (glibc 2.35, GCC 11 / GLIBCXX 3.4.29).
    # Building on a newer runner would silently raise the minimum glibc of the
    # launcher/bridge and exclude Debian 12 / Ubuntu 22.04 class systems.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            file \
            libegl-dev \
            libgl-dev \
            libgtk-3-dev \
            libmpv-dev \
            libvlc-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            pkg-config \
            rpm \
            xvfb \
            xwayland

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select application version
        shell: bash
        run: |
          version="$(sed -n 's/^APP_VERSION=//p' gradle.properties | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            case "$GITHUB_REF_NAME" in
              linux-v*) version="${GITHUB_REF_NAME#linux-v}" ;;
              v*) version="${GITHUB_REF_NAME#v}" ;;
            esac
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building CloudStream Desktop $version"

      - name: Run JVM tests, native build, and distributable build
        run: |
          ./gradlew \
            :plugin-runtime:test \
            :player-abstraction:test \
            :desktop-app:test \
            :desktop-app:linuxNativeBridge \
            :desktop-app:createDistributable \
            --no-daemon \
            -PAPP_VERSION="$APP_VERSION"

      - name: Validate Linux dependencies and runtime image
        run: |
          bash desktop-app/check-linux-dependencies.sh
          SKIP_BUILD=1 bash desktop-app/packaging/build-linux-packages.sh --validate
          desktop-file-validate desktop-app/packaging/linux/com.cloudstream.CloudStreamDesktop.desktop

      - name: Install AppImage tool
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool.real"
          chmod +x "$RUNNER_TEMP/appimagetool.real"
          cat > "$RUNNER_TEMP/appimagetool" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          tool_dir="$(dirname "$(readlink -f "$0")")"
          exec "$tool_dir/appimagetool.real" --appimage-extract-and-run "$@"
          EOF
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build TAR, DEB, RPM, and AppImage packages
        run: |
          # Train the AppCDS archive headlessly (xvfb) for faster cold starts.
          CLOUDSTREAM_TRAIN_CDS=1 SKIP_BUILD=1 bash desktop-app/packaging/build-linux-packages.sh --all

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          tar_file="desktop-app/build/outputs/linux/CloudStream-Desktop-${APP_VERSION}-linux-x86_64.tar.gz"
          deb_file="desktop-app/build/outputs/linux/cloudstream-desktop_${APP_VERSION}_amd64.deb"
          rpm_file="desktop-app/build/outputs/linux/cloudstream-desktop-${APP_VERSION}-1.x86_64.rpm"
          appimage_file="desktop-app/build/outputs/linux/CloudStream-Desktop-${APP_VERSION}-linux-x86_64.AppImage"
          tar -tzf "$tar_file" | grep -Fx './CloudStream-Desktop/bin/CloudStream-Desktop'
          dpkg-deb --info "$deb_file" | grep -Fx " Version: $APP_VERSION"
          rpm -qpl "$rpm_file" | grep -Fx '/opt/cloudstream/CloudStream-Desktop/bin/CloudStream-Desktop'
          ls -l "$appimage_file"
          test -x "$appimage_file"
          test "$(od -An -tx1 -N3 "$appimage_file" | tr -d ' \n')" = "414902"

      - name: Smoke-test package install and uninstall
        shell: bash
        run: |
          set -euo pipefail
          deb_file="desktop-app/build/outputs/linux/cloudstream-desktop_${APP_VERSION}_amd64.deb"
          rpm_file="desktop-app/build/outputs/linux/cloudstream-desktop-${APP_VERSION}-1.x86_64.rpm"
          smoke_root="$RUNNER_TEMP/package-smoke"
          deb_root="$smoke_root/deb-root"
          rpm_root="$smoke_root/rpm-root"
          mkdir -p "$deb_root/var/lib/dpkg" "$rpm_root/var/lib/rpm"

          sudo dpkg --root="$deb_root" --admindir="$deb_root/var/lib/dpkg" \
            --force-depends --unpack "$deb_file"
          test -x "$deb_root/opt/cloudstream/CloudStream-Desktop/bin/CloudStream-Desktop"
          sudo dpkg --root="$deb_root" --admindir="$deb_root/var/lib/dpkg" \
            --force-depends --purge cloudstream-desktop
          test ! -e "$deb_root/opt/cloudstream/CloudStream-Desktop/bin/CloudStream-Desktop"

          sudo rpm --root "$rpm_root" --dbpath "$rpm_root/var/lib/rpm" --initdb
          sudo rpm --root "$rpm_root" --dbpath "$rpm_root/var/lib/rpm" \
            --nodeps --install "$rpm_file"
          test -x "$rpm_root/opt/cloudstream/CloudStream-Desktop/bin/CloudStream-Desktop"
          sudo rpm --root "$rpm_root" --dbpath "$rpm_root/var/lib/rpm" \
            --nodeps --erase cloudstream-desktop
          test ! -e "$rpm_root/opt/cloudstream/CloudStream-Desktop/bin/CloudStream-Desktop"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-linux-${{ env.APP_VERSION }}
          if-no-files-found: error
          path: desktop-app/build/outputs/linux/*

      - name: Upload Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          name: CloudStream ${{ env.APP_VERSION }}
          body: >-
            CloudStream ${{ env.APP_VERSION }} for Linux (x86_64).

            Install the DEB/RPM for your distribution, or use the portable
            TAR.GZ / AppImage. Requires GTK 3, WebKitGTK 4.1, libmpv,
            X11 (or XWayland on Wayland sessions) and OpenGL/EGL from the
            host system. Run `bash desktop-app/check-linux-dependencies.sh`
            for an exact machine check.
          files: desktop-app/build/outputs/linux/*
          fail_on_unmatched_files: true
          generate_release_notes: false

  # Experimental aarch64/ARM64 build. Native dependencies (WebKitGTK 4.1,
  # libmpv, libVLC) exist for arm64 on Debian/Ubuntu, so packaging is
  # feasible, but media-playback behaviour on ARM GPUs is not yet validated.
  # This job never uploads to a release; it only publishes a build artifact.
  linux-arm64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            file \
            libegl-dev \
            libgl-dev \
            libgtk-3-dev \
            libmpv-dev \
            libvlc-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            pkg-config \
            rpm \
            xvfb \
            xwayland

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select application version
        shell: bash
        run: |
          version="$(sed -n 's/^APP_VERSION=//p' gradle.properties | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            case "$GITHUB_REF_NAME" in
              linux-v*) version="${GITHUB_REF_NAME#linux-v}" ;;
              v*) version="${GITHUB_REF_NAME#v}" ;;
            esac
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building CloudStream Desktop (arm64) $version"

      - name: Build and package for arm64
        run: |
          ./gradlew \
            :desktop-app:test \
            :desktop-app:linuxNativeBridge \
            :desktop-app:createDistributable \
            --no-daemon \
            -PAPP_VERSION="$APP_VERSION"
          SKIP_BUILD=1 bash desktop-app/packaging/build-linux-packages.sh --tar --deb

      - name: Upload arm64 packages
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-linux-arm64-${{ env.APP_VERSION }}
          if-no-files-found: error
          path: desktop-app/build/outputs/linux/*
